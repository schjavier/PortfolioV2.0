<section class="contact-section">
  <h2>{{ currentTranslations().contact.title }}</h2>

  <form (submit)="sendContact($event)" class="contact-form">
    <div class="form-group">
      <label for="name">{{ currentTranslations().contact.nameLabel }}</label>
      <input
        type="text"
        id="name"
        [value]="name()"
        (input)="name.set($any($event.target).value)"
        required
      />
    </div>

    <div class="form-group">
      <label for="email">{{ currentTranslations().contact.emailLabel }}</label>
      <input
        type="email"
        id="email"
        [value]="email()"
        (input)="email.set($any($event.target).value)"
        required
      />
      @if (email().length > 0 && !isEmailValid()) {
        <span class="error-msg">{{ currentTranslations().contact.emailValidationError }}</span>
      }
    </div>

    <div class="form-group">
      <label for="comment">{{ currentTranslations().contact.messageLabel }}</label>
      <textarea
        id="comment"
        rows="5"
        [value]="comment()"
        (input)="comment.set($any($event.target).value)"
        required
      ></textarea>
    </div>

    <button type="submit" [disabled]="!isFormValid()" class="submit-btn">
      {{ currentTranslations().contact.sendButton }}
    </button>
  </form>

  <p class="back-link">
    <a routerLink="">{{ currentTranslations().contact.backLink }}</a>
  </p>
</section>
