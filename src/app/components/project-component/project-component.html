<h2> {{ currentTranslations().projects.title }} </h2>

<section class="projects">

  @switch (projectKey()){
    @case ('brotes'){
      <app-brotes/>
    }
    @case ('emailsender'){
      <app-emailsender/>
    }
    @default {
      <p>{{ currentTranslations().projects.notFound }}</p>
    }
  }
</section>
